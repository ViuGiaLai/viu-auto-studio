<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viu Auto Studio</title>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script>
      window.__viuRuntimeErrors = [];
      window.addEventListener('error', function (event) {
        window.__viuRuntimeErrors.push({ message: event.message, stack: event.error && event.error.stack, source: event.filename, line: event.lineno });
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason || {};
        window.__viuRuntimeErrors.push({ message: String(reason.message || reason), stack: reason.stack });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
