<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viu Flow Connector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header><span class="logo">▷</span><div><h1>Viu Flow Connector</h1><p>Kết nối động với Viu Auto Studio</p></div></header>
    <section>
      <label for="apiBaseUrl">Runtime API URL</label>
      <input id="apiBaseUrl" autocomplete="off" placeholder="Sao chép từ Cài đặt → Flow Connector" />
      <small>Chỉ chấp nhận backend loopback do Electron khởi động. Không có port cố định.</small>
    </section>
    <section>
      <label for="pairingCode">Mã ghép một lần</label>
      <input id="pairingCode" inputmode="numeric" maxlength="6" placeholder="6 chữ số trong ứng dụng" />
    </section>
    <div class="actions"><button id="pair">Ghép Extension</button><button id="test" class="secondary">Kiểm tra kết nối</button></div>
    <div id="status" role="status">Chưa kiểm tra</div>
  </main>
  <script src="options.js"></script>
</body>
</html>
