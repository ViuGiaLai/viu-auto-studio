name: Viu Auto Studio Release CI/CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Backend & Frontend Validation
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r viu-auto-studio/backend/requirements.txt
          pip install pytest

      - name: Run Backend Validation Suite
        env:
          PYTHONUTF8: "1"
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'viu-auto-studio'); from backend.core.config import init_data_dirs; init_data_dirs()"
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'viu-auto-studio'); from backend.render.smart_engine import detect_hardware_capabilities; print(detect_hardware_capabilities())"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Desktop Dependencies
        working-directory: viu-auto-studio/desktop
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Check
        working-directory: viu-auto-studio/desktop
        run: pnpm exec tsc --noEmit

      - name: Run Frontend Production Build
        working-directory: viu-auto-studio/desktop
        run: pnpm run build

  build-packages:
    name: Build Installer (${{ matrix.os }})
    needs: validate-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Desktop Dependencies
        working-directory: viu-auto-studio/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Production Frontend & Electron Main
        working-directory: viu-auto-studio/desktop
        run: pnpm run build

      - name: Package Desktop Installers
        working-directory: viu-auto-studio/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --${{ matrix.platform }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viu-auto-studio-${{ matrix.platform }}
          path: viu-auto-studio/desktop/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viu-auto-studio-win
          path: release-dist/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viu-auto-studio-mac
          path: release-dist/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viu-auto-studio-linux
          path: release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Viu Auto Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


